<style>
/* Concept : un dossier de police. Fond papier bleuté, ruban jaune de scène de crime, galons pour les grades, pièces et fiches numérotées. */
:root{
  --bg:#E6EAF0; --surface:#F6F8FB; --soft:#DAE1EA; --ink:#13202D; --muted:#4F5F73; --line:#BFC9D6;
  --accent:#1D4E89; --on-accent:#FFFFFF; --tape:#F2C200; --tape-ink:#16130A;
  --ok:#1B7550; --warn:#8A5700; --bad:#B42318; --gold:#B07C00;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C141E; --surface:#142030; --soft:#1C2B3E; --ink:#E5ECF4; --muted:#9CABBD; --line:#2B3B4F;
    --accent:#86B8F5; --on-accent:#0C141E; --ok:#5FCB9A; --warn:#E6B450; --bad:#F48A80; --gold:#F2C200;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C141E; --surface:#142030; --soft:#1C2B3E; --ink:#E5ECF4; --muted:#9CABBD; --line:#2B3B4F;
  --accent:#86B8F5; --on-accent:#0C141E; --ok:#5FCB9A; --warn:#E6B450; --bad:#F48A80; --gold:#F2C200;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; font:16px/1.5 var(--f-body); background:var(--bg); color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px; -webkit-text-size-adjust:100%;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:10}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.wrap{max-width:680px; margin:0 auto}
.muted{color:var(--muted)}
.ico{flex:none}

/* barre du haut */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--bg); border-bottom:1px solid var(--line)}
.topin{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:10px}
.brand{border:0; background:none; padding:0; text-align:left; cursor:pointer; display:grid; gap:2px; min-height:44px; align-content:center}
.bw{font:800 28px/1 var(--f-display); letter-spacing:.05em; text-transform:uppercase}
.bs{font:500 10px/1 var(--f-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.stats{display:flex; gap:6px}
.chip{font:400 11px/1 var(--f-mono); letter-spacing:.04em; text-transform:uppercase; padding:7px 9px; border:1px solid var(--line); border-radius:4px; background:var(--surface); color:var(--muted); white-space:nowrap}
.chip b{color:var(--ink); font-weight:500; margin-left:3px}
.tape{margin-top:12px; background:var(--tape); color:var(--tape-ink); overflow:hidden; white-space:nowrap; padding:5px 0; font:500 11px/1 var(--f-mono); letter-spacing:.22em; text-transform:uppercase}

/* accueil */
.hero{padding-top:26px}
.kick{font:500 12px/1.3 var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0}
h1{font:800 clamp(40px,12vw,64px)/.95 var(--f-display); text-transform:uppercase; margin:10px 0 12px; text-wrap:balance}
.lead{max-width:52ch; color:var(--muted); margin:0}
.lvl{margin-top:34px}
.l1{--lvl:var(--ok)} .l2{--lvl:var(--warn)} .l3{--lvl:var(--bad)}
.lvlh{display:flex; align-items:center; gap:12px}
.gal{display:inline-flex; flex-direction:column; gap:2px; color:var(--lvl)}
h2{font:700 30px/1 var(--f-display); text-transform:uppercase; letter-spacing:.02em; margin:0}
.rule{font:400 12px/1.5 var(--f-mono); color:var(--muted); margin:6px 0 0}
.cards{display:grid; gap:10px; margin-top:14px}
.card{display:grid; gap:4px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:14px 16px; cursor:pointer; min-height:64px}
.card:hover{border-color:var(--lvl)}
.card .no{font:500 11px/1.2 var(--f-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--lvl)}
.card .tt{font:700 27px/1.05 var(--f-display); text-transform:uppercase; letter-spacing:.01em}
.card .ac{color:var(--muted); font-size:15px}
.card .st{font:400 12px/1.4 var(--f-mono); color:var(--muted); margin-top:4px}
.stars{color:var(--gold); letter-spacing:.1em; font-size:15px}

/* dossier */
.main{padding-top:6px}
.brief{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:14px 16px; margin-top:16px}
.brief .kick{color:var(--lvl)}
.ct{font:800 clamp(32px,9vw,44px)/1 var(--f-display); text-transform:uppercase; margin:6px 0 8px}
.brief p{margin:0 0 4px; max-width:62ch}
.lnk{border:0; background:none; color:var(--accent); font:500 14px/1 var(--f-mono); padding:12px 0 4px; min-height:44px; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.sec{font:700 24px/1 var(--f-display); text-transform:uppercase; letter-spacing:.03em; margin:24px 0 10px}
.stack{display:grid; gap:10px}
.back{display:inline-flex; align-items:center; gap:4px; border:0; background:none; color:var(--accent); font:500 14px/1 var(--f-mono); padding:14px 0 0; min-height:48px; cursor:pointer}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px 14px; min-height:64px; cursor:pointer}
.row:disabled{cursor:not-allowed; opacity:.62}
.row .rt{display:grid; gap:2px; min-width:0}
.row .rn{font-weight:600}
.row .rd{font-size:14px; color:var(--muted)}
.row .rc{font:400 12px/1 var(--f-mono); color:var(--muted); white-space:nowrap}
.obj{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:transparent; border:1.5px dashed var(--line); border-radius:6px; padding:12px 14px; min-height:56px; cursor:pointer}
.obj span{flex:1; font-weight:500; min-width:0}
.obj em{font:500 11px/1 var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-style:normal}
.ev{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:12px 14px}
.ev .tag{font:500 11px/1 var(--f-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
.ev h3{margin:6px 0 4px; font-size:17px; font-weight:600}
.ev p{margin:0; font-size:15.5px}
.empty{border:1.5px dashed var(--line); border-radius:6px; padding:16px; color:var(--muted)}
.hint{background:var(--soft); border-radius:4px; padding:10px 12px; font-size:15px}
.hint b{font:500 11px/1 var(--f-mono); letter-spacing:.12em; text-transform:uppercase; display:block; margin-bottom:4px; color:var(--muted)}

/* personnes */
.who{display:flex; align-items:center; gap:14px}
.av{flex:none; width:48px; height:58px; border-radius:3px; background:var(--soft); border:1px solid var(--line); display:grid; place-items:center; font:800 22px/1 var(--f-display); letter-spacing:.04em}
.who .wn{font-weight:600; font-size:18px; line-height:1.2}
.who .wm{font:400 12px/1.4 var(--f-mono); color:var(--muted)}
.conv{display:grid; gap:8px; margin:14px 0}
.bub{max-width:90%; padding:10px 12px; border-radius:10px 10px 10px 2px; font-size:15.5px; background:var(--surface); border:1px solid var(--line)}
.bub.me{justify-self:end; border-radius:10px 10px 2px 10px; background:var(--accent); color:var(--on-accent); border-color:transparent}
.bub small{display:block; font:500 10.5px/1 var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
.q{width:100%; text-align:left; background:transparent; border:1px solid var(--line); border-radius:6px; padding:12px 14px; min-height:48px; color:var(--accent); font-weight:500; cursor:pointer}
.q:hover{background:var(--soft)}

/* accusation */
.opt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:10px 14px; min-height:60px; cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:var(--soft)}
.opt .ot{display:grid; gap:2px; min-width:0}
.opt .ot b{font-weight:600}
.opt .ot span{font-size:14px; color:var(--muted)}
.fb{background:var(--soft); border-radius:4px; padding:10px 12px; margin:12px 0 0; font-size:15px}
.btn{min-height:52px; padding:0 20px; border-radius:6px; border:1px solid transparent; font:600 16px/1 var(--f-body); cursor:pointer; width:100%}
.btn.p{background:var(--accent); color:var(--on-accent)}
.btn.g{background:transparent; border-color:var(--line); color:var(--ink)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.cta{margin-top:18px; display:grid; gap:10px}

/* fin */
.verdict{font:800 clamp(44px,14vw,76px)/.92 var(--f-display); text-transform:uppercase; margin:10px 0 8px}
.verdict.win{color:var(--ok)} .verdict.lose{color:var(--bad)}
.big-stars{font-size:30px}

/* navigation */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:9; background:var(--surface); border-top:1px solid var(--line); padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.navin{max-width:680px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:4px}
.nb{position:relative; display:grid; justify-items:center; gap:3px; border:0; background:transparent; min-height:52px; padding:6px 2px; border-radius:6px; color:var(--muted); font:500 10.5px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; cursor:pointer}
.nb[aria-current="page"]{color:var(--accent); background:var(--soft)}
.nb i{position:absolute; top:4px; right:calc(50% - 22px); min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--accent); color:var(--on-accent); font:500 10px/17px var(--f-mono); font-style:normal; text-align:center; letter-spacing:0}
#toast{position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:20; max-width:calc(100% - 32px); background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:6px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important; scroll-behavior:auto!important}}
</style>

<script>
/* ---------- Niveaux ---------- */
const LV={
  1:{nom:'Stagiaire',essais:Infinity,conseils:3,preuves:0,cls:'l1',regle:'Accusation simple · essais illimités · 3 conseils du chef'},
  2:{nom:'Inspecteur',essais:3,conseils:2,preuves:1,cls:'l2',regle:'Accusation + 1 preuve · 3 essais · 2 conseils du chef'},
  3:{nom:'Commissaire',essais:2,conseils:1,preuves:2,cls:'l3',regle:'Accusation + 2 preuves · 2 essais · 1 conseil · lieux verrouillés'}
};

/* ---------- Dossiers ---------- */
const CASES=[
{
  id:'f1',niv:1,titre:'La boulangerie cambriolée',accroche:'Une caisse vidée, une porte sans trace d’effraction.',
  intro:'Boulangerie Lemoine, rue des Récollets. Cette nuit, 840 € ont disparu de la caisse. M. Lemoine a trouvé la porte de service entrouverte à 5 h. Trois personnes gravitent autour de la boutique : à vous de trouver qui a agi.',
  indices:{
    porte:{n:'Porte de service',t:'Aucune effraction. La serrure est intacte : le voleur avait une clé, ou la porte n’était pas verrouillée.'},
    cles:{n:'Registre des clés',t:'Trois clés existent : celle de M. Lemoine, celle de l’apprenti Hugo et celle du livreur Denis.'},
    traces:{n:'Traces dans la farine',t:'Des empreintes de baskets, pointure 43, vont de la porte à la caisse.'},
    caisse:{n:'Tiroir-caisse',t:'Le tiroir est vide. Les 840 € du fond de caisse ont disparu, les tickets sont intacts.'},
    planning:{n:'Planning affiché',t:'Hugo arrive à 4 h 30 chaque matin. Denis livre à 6 h.'},
    camera:{n:'Caméra de la pharmacie',t:'À 2 h 07, une camionnette blanche s’arrête devant la boulangerie. Elle repart à 2 h 31.'}
  },
  lieux:[
    {id:'arr',nom:'Arrière-boutique',desc:'Farine partout, un sol blanc de traces.',objets:['porte','cles','traces']},
    {id:'bout',nom:'Boutique',desc:'Le comptoir, la caisse, le planning.',objets:['caisse','planning']},
    {id:'rue',nom:'Rue des Récollets',desc:'Une pharmacie fait face à la boulangerie.',objets:['camera']}
  ],
  suspects:[
    {id:'hugo',nom:'Hugo Perrin',age:17,role:'Apprenti boulanger',alibi:'« J’étais chez moi, avec ma mère, jusqu’à 4 h. »',
      qs:[{q:'Quelle est votre pointure ?',a:'« Du 39. Les pieds de mon âge, pas ceux d’un géant. »'},
          {q:'Comment venez-vous au travail ?',a:'« En métro. Je n’ai pas le permis, j’ai 17 ans. »'},
          {q:'Avez-vous une clé ?',a:'« Oui, pour ouvrir à 4 h 30. Elle est toujours dans mon sac. »'}],
      conf:{traces:{t:'Il regarde ses chaussures. « Du 43 ? Je chausse du 39. Ce n’est pas moi. »'},camera:{t:'« Une camionnette ? Je ne sais même pas conduire. »'}}},
    {id:'denis',nom:'Denis Maury',age:34,role:'Livreur',alibi:'« Couché à minuit, seul chez moi. Pas de témoin, désolé. »',
      qs:[{q:'Quelle est votre pointure ?',a:'« Du 43. Comme la moitié des hommes. »'},
          {q:'Quel véhicule conduisez-vous ?',a:'« Ma camionnette blanche. Je livre trois boulangeries du quartier. »'},
          {q:'Avez-vous une clé ?',a:'« Oui, M. Lemoine me la prête pour les livraisons tôt. »'}],
      conf:{traces:{t:'Il avale sa salive. « Du 43... il y en a des milliers. »'},camera:{t:'Il tripote ses clés. « Ma camionnette était peut-être dans le coin, je ne sais plus. »'}}},
    {id:'brault',nom:'Mme Brault',age:71,role:'Voisine du dessus, témoin',alibi:'« À ma fenêtre. À mon âge, on ne dort plus. »',
      qs:[{q:'Qu’avez-vous vu cette nuit ?',a:'« Une camionnette blanche vers 2 h, et un grand gaillard en capuche. »'},
          {q:'Pouvez-vous le décrire ?',a:'« Non, il me tournait le dos. Il marchait vite. »'}],
      conf:{camera:{t:'« C’est bien cette camionnette-là ! Je l’ai vue de ma fenêtre. »'}}}
  ],
  solution:{coupable:'denis',preuves:['cles','traces','camera'],expl:'Seuls Hugo et Denis avaient une clé, et la porte n’a pas été forcée. Les traces en pointure 43 écartent Hugo, qui chausse du 39. La camionnette blanche filmée à 2 h 07 est celle de Denis, alors que Hugo n’a pas le permis.'},
  hints:['Qui possédait une clé de la porte de service ?','Comparez la pointure des traces avec celle de chaque suspect.','Une camionnette blanche a été filmée à 2 h 07. Qui conduit ?']
},
{
  id:'f2',niv:1,titre:'Le collier de la Villa Mirabelle',accroche:'Un coffret ouvert pendant le dîner de famille.',
  intro:'Villa Mirabelle, dîner de famille. Entre 20 h et 21 h, le collier de perles de Mme Verdier a disparu de sa chambre, au premier étage. Le coffret a été ouvert avec sa clé, sans aucune trace de force.',
  indices:{
    coffret:{n:'Coffret à bijoux',t:'Ouvert avec sa clé, sans effraction. Le collier de perles manque.'},
    vin:{n:'Goutte de vin rouge',t:'Une goutte de vin rouge sèche sur le tapis, juste devant le coffret.'},
    terre:{n:'Terre sur le palier',t:'Quelques miettes de terre sèche sur le palier. Il a plu l’après-midi dans le jardin.'},
    livre:{n:'Livre creux',t:'Dans la bibliothèque, un faux livre servait de cachette à la clé du coffret. Il est vide. Seuls les proches connaissaient cette cachette.'},
    plan:{n:'Plan de table',t:'Clotilde a servi chaque plat devant tous les convives, de 20 h à 21 h. Basile a quitté la table vers 20 h 20.'},
    verres:{n:'Verres de la table',t:'Seul le verre de Basile contenait du vin rouge. Les autres convives buvaient du blanc ou de l’eau.'}
  },
  lieux:[
    {id:'ch',nom:'Chambre de Mme Verdier',desc:'Le coffret, le tapis, le palier.',objets:['coffret','vin','terre']},
    {id:'bib',nom:'Bibliothèque',desc:'Des rayonnages jusqu’au plafond.',objets:['livre']},
    {id:'sal',nom:'Salle à manger',desc:'La table n’a pas encore été desservie.',objets:['plan','verres']}
  ],
  suspects:[
    {id:'basile',nom:'Basile Verdier',age:26,role:'Neveu de Mme Verdier',alibi:'« J’ai pris un appel dans le jardin d’hiver, je suis revenu pour le dessert. »',
      qs:[{q:'Vous buvez du rouge ?',a:'« Toujours. Le Bordeaux de ma tante est excellent. »'},
          {q:'Connaissiez-vous la cachette de la clé ?',a:'« Bien sûr, je viens ici depuis l’enfance. »'},
          {q:'Qui vous a vu pendant votre appel ?',a:'« Personne. Je me suis isolé. »'}],
      conf:{vin:{t:'Il fixe le tapis. « Un hasard. On renverse du vin partout. »'},plan:{t:'« Je suis sorti cinq minutes, pas de quoi en faire une affaire. »'},verres:{t:'Il garde le silence trop longtemps.'},livre:{t:'« Tout le monde pouvait le savoir. »'}}},
    {id:'clotilde',nom:'Clotilde Roux',age:58,role:'Cuisinière',alibi:'« Au fourneau, puis au service. Je n’ai pas quitté le rez-de-chaussée. »',
      qs:[{q:'Connaissez-vous la cachette ?',a:'« Oui, après vingt ans dans cette maison. Mais je n’y ai pas touché. »'},
          {q:'Qui a quitté la table ?',a:'« Monsieur Basile, vers 20 h 20, pendant le plat. »'}],
      conf:{plan:{t:'« Voilà, j’ai servi tout le monde. Vous pouvez demander. »'},livre:{t:'« Je connais la cachette, mais je ne monte jamais à l’étage pendant le service. »'}}},
    {id:'armand',nom:'Armand Colin',age:63,role:'Jardinier',alibi:'« J’ai quitté la maison à 19 h, à vélo. »',
      qs:[{q:'Connaissez-vous la cachette ?',a:'« Non, je n’entre jamais dans la bibliothèque. »'},
          {q:'Que dites-vous de la terre sur le palier ?',a:'« Je dépose mes bottes à la porte, comme toujours. »'}],
      conf:{terre:{t:'« Je laisse mes bottes dehors. Cette terre n’est pas la mienne. »'}}}
  ],
  solution:{coupable:'basile',preuves:['vin','livre','plan','verres'],expl:'Seuls les proches connaissaient la cachette de la clé. Clotilde a servi la table toute la soirée et Armand était parti à 19 h. Basile est sorti vers 20 h 20, et c’est le seul convive à boire du vin rouge, comme la goutte retrouvée près du coffret.'},
  hints:['Qui a pu quitter la table sans éveiller les soupçons ?','Comparez la goutte de vin avec ce que chacun buvait.','Qui connaissait la cachette de la clé et n’a pas d’alibi ?']
},
{

  acc:'<path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/>',
  lens:'<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l6 6"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
};
const ico=(n,s)=>`<svg class="ico" viewBox="0 0 24 24" width="${s||22}" height="${s||22}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]}</svg>`;
const CH=n=>`<span class="gal" aria-hidden="true">${'<svg viewBox="0 0 24 10" width="24" height="10"><path d="M2 8l10-6 10 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>'.repeat(n)}</span>`;
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const ini=n=>n.replace(/^(Mme|Dr|Maître)\s+/,'').split(' ').slice(0,2).map(w=>w[0]).join('');
const num=(c)=>String(CASES.indexOf(c)+1).padStart(2,'0');

/* ---------- État ---------- */
let prog={};
try{prog=JSON.parse(localStorage.getItem('brigade36')||'{}')||{}}catch(e){prog={}}
const saveProg=()=>{try{localStorage.setItem('brigade36',JSON.stringify(prog))}catch(e){}};
const S={view:'home',g:null,games:{},res:null};
const app=document.getElementById('app');
let toastT;
function toast(m){const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

function newGame(c){
  const log={};c.suspects.forEach(s=>log[s.id]=[]);
  return {c,found:[],log,asked:{},shown:{},errs:0,hints:0,tab:'lieux',lieu:null,sus:null,picker:false,sel:null,proofs:[],confirm:false,brief:true,fb:''};
}
function addClue(g,id){
  if(g.found.includes(id))return;
  g.found.push(id);
  toast('Pièce n° '+String(g.found.length).padStart(2,'0')+' ajoutée au carnet : '+g.c.indices[id].n);
}

/* ---------- Vues ---------- */
function topbar(g){
 const L=g&&LV[g.level];
 const left=g&&g.hintsAllowed?Math.max(0,g.hintLimit-g.hints):0;
 const chips=g?`<div class="stats"><span class="chip">Essais<b>${L.essais===Infinity?'∞':Math.max(0,L.essais-g.errs)}</b></span><button class="chip b36-hint" data-a="hint" ${left?'':'disabled'} title="${g.hintsAllowed?'Plus de conseils disponibles':'Indices désactivés lors de la préparation'}">Demander un indice (${left})</button></div>`:'';
 const band='Police judiciaire · Ne pas franchir · '.repeat(5);
 return `<header class="top"><div class="wrap topin"><button class="brand" data-a="home" aria-label="Retour aux dossiers"><span class="bw">Brigade 36</span><span class="bs">Quai des Orfèvres</span></button>${chips}</div></header><div class="tape" aria-hidden="true">${band}</div>`;
}
function card(c){
  const p=prog[c.id],run=S.games[c.id];
  return `<button class="card" data-a="open" data-id="${c.id}"><span class="no">Dossier ${num(c)}${run?' · en cours':''}</span><span class="tt">${c.titre}</span><span class="ac">${c.accroche}</span><span class="st">${p?`<span class="stars" aria-label="${p.s} étoiles sur 3">${stars(p.s)}</span> résolu`:`${c.suspects.length} personnes · ${c.lieux.length} lieux`}</span></button>`;
}
function homeV(){
  const done=CASES.filter(c=>prog[c.id]).length;
  const lv=[1,2,3].map(n=>{const L=LV[n];return `<section class="lvl ${L.cls}"><div class="lvlh">${CH(n)}<h2>${L.nom}</h2></div><p class="rule">${L.regle}</p><div class="cards">${CASES.filter(c=>c.niv===n).map(card).join('')}</div></section>`}).join('');
  return topbar(null)+`<main class="wrap"><section class="hero"><p class="kick">Brigade criminelle · ${done} sur ${CASES.length} dossiers résolus</p><h1>Qui est le coupable ?</h1><p class="lead">Visitez les lieux, examinez les pièces, interrogez chaque personne et confrontez-la à votre carnet. Plus le grade est élevé, moins on vous pardonne.</p></section>${lv}</main>`;
}

function ev(g,id){
  const cl=g.c.indices[id],k=g.found.indexOf(id)+1;
  return `<article class="ev"><span class="tag">Pièce n° ${String(k).padStart(2,'0')}</span><h3>${cl.n}</h3><p>${cl.t}</p></article>`;
}
function briefH(g){
  const c=g.c,L=LV[g.level];
  return `<section class="brief ${L.cls}"><p class="kick">${L.nom} · Dossier ${num(c)}</p><h1 class="ct">${c.titre}</h1>${g.brief?`<p>${c.intro}</p>`:''}<button class="lnk" data-a="brief">${g.brief?'Réduire le rapport':'Relire le rapport'}</button></section>`;
}
function lieuxTab(g){
  const c=g.c;
  if(g.lieu){
    const l=c.lieux.find(x=>x.id===g.lieu);
    return `<button class="back" data-a="lieux">${ico('back',18)} Lieux</button><h2 class="sec">${l.nom}</h2><p class="muted" style="margin:0 0 12px">${l.desc}</p><div class="stack">${l.objets.map(o=>g.found.includes(o)?ev(g,o):`<button class="obj" data-a="examine" data-id="${o}">${ico('lens')}<span>${c.indices[o].n}</span><em>Examiner</em></button>`).join('')}</div>`;
  }
  return briefH(g)+`<h2 class="sec">Lieux à visiter</h2><div class="stack">`+c.lieux.map(l=>{
    const lock=g.level===3&&l.verrou&&!g.found.includes(l.verrou);
    const n=l.objets.filter(o=>g.found.includes(o)).length;
    return `<button class="row" data-a="lieu" data-id="${l.id}" ${lock?'disabled':''}><span class="rt"><span class="rn">${l.nom}</span><span class="rd">${lock?'Fermé à clé. Il vous manque un renseignement pour entrer.':l.desc}</span></span><span class="rc">${lock?ico('lock',20):n+' / '+l.objets.length}</span></button>`;
  }).join('')+`</div>`;
}
function carnetTab(g){
 const c=g.c,left=g.hintsAllowed?Math.max(0,g.hintLimit-g.hints):0;
 let h='<h2 class="sec">Carnet de pièces</h2>';
 h+=g.found.length?`<div class="stack">${g.found.map(id=>ev(g,id)).join('')}</div>`:'<p class="empty">Aucune pièce pour l’instant. Visitez un lieu et examinez ce que vous y trouvez.</p>';
 h+='<h2 class="sec">Indices demandés</h2><div class="stack">';
 h+=(g.hintLog||[]).map((t,i)=>`<div class="hint"><b>Conseil ${i+1} · Palier ${Math.min(3,i+1)}</b> ${t}</div>`).join('');
 h+=`<button class="btn g" data-a="hint" ${left?'':'disabled'}>${left?'Demander un indice ('+left+' restant'+(left>1?'s':'')+')':'Aucun indice disponible'}</button></div>`;
 if(g.hints)h+='<p class="muted">Chaque indice demandé retire une étoile au score final.</p>';
 return h;
}
function persTab(g){
  const c=g.c;
  if(!g.sus){
    return `<h2 class="sec">Suspects et témoins</h2><div class="stack">`+c.suspects.map(s=>{
      const n=(g.asked[s.id]||[]).length;
      return `<button class="opt" data-a="pers" data-id="${s.id}"><span class="av">${ini(s.nom)}</span><span class="ot"><b>${s.nom}</b><span>${s.role} · ${s.age} ans</span></span></button>`.replace('</span></button>',`</span></button>`);
    }).join('')+`</div>`;
  }
  const s=c.suspects.find(x=>x.id===g.sus),log=g.log[s.id],asked=g.asked[s.id]||[],shown=g.shown[s.id]||[];
  let h=`<button class="back" data-a="perslist">${ico('back',18)} Personnes</button>`;
  h+=`<div class="who" style="margin-top:8px"><span class="av">${ini(s.nom)}</span><div><div class="wn">${s.nom}</div><div class="wm">${s.role} · ${s.age} ans</div></div></div>`;
  h+=`<div class="conv"><div class="bub"><small>Première déclaration</small>${s.alibi}</div>`;
  log.forEach(e=>{
    if(e.k==='q')h+=`<div class="bub me">${e.q}</div><div class="bub">${e.a}</div>`;
    else h+=`<div class="bub me"><small style="color:inherit;opacity:.8">Pièce présentée</small>${e.n}</div><div class="bub">${e.t}</div>`;
  });
  h+=`</div>`;
  const rest=s.qs.map((q,i)=>asked.includes(i)?'':`<button class="q" data-a="ask" data-i="${i}">${q.q}</button>`).join('');
  h+=`<h2 class="sec">Poser une question</h2><div class="stack">${rest||'<p class="muted" style="margin:0">Plus de question à poser.</p>'}</div>`;
  h+=`<div class="cta"><button class="btn g" data-a="picker" ${g.found.length?'':'disabled'}>${g.found.length?(g.picker?'Fermer le carnet':'Présenter une pièce du carnet'):'Carnet vide : rien à présenter'}</button></div>`;
  if(g.picker)h+=`<div class="stack" style="margin-top:10px">`+g.found.map(id=>`<button class="row" data-a="show" data-id="${id}" ${shown.includes(id)?'disabled':''}><span class="rt"><span class="rn">${c.indices[id].n}</span></span><span class="rc">${shown.includes(id)?'déjà présentée':'présenter'}</span></button>`).join('')+`</div>`;
  return h;
}
function accTab(g){
  const c=g.c,L=LV[g.level],need=L.preuves;
  let h=`<h2 class="sec">Porter une accusation</h2><p class="muted" style="margin:0">${need?`Désignez le coupable, puis choisissez ${need} pièce${need>1?'s':''} du carnet qui le prouve${need>1?'nt':''}.`:'Désignez le coupable.'} ${L.essais===Infinity?'Vos essais sont illimités.':'Il vous reste '+Math.max(0,L.essais-g.errs)+' essai'+(L.essais-g.errs>1?'s':'')+'.'}</p>`;
  if(g.fb)h+=`<p class="fb" role="alert">${g.fb}</p>`;
  h+=`<div class="stack" style="margin-top:12px" role="group" aria-label="Suspects">`+c.suspects.map(s=>`<button class="opt" data-a="sel" data-id="${s.id}" aria-pressed="${g.sel===s.id}"><span class="av">${ini(s.nom)}</span><span class="ot"><b>${s.nom}</b><span>${s.role}</span></span></button>`).join('')+`</div>`;
  if(need&&g.sel){
    h+=`<h2 class="sec">Pièces à l’appui (${g.proofs.length} / ${need})</h2>`;
    h+=g.found.length>=need?`<div class="stack" role="group" aria-label="Pièces">`+g.found.map(id=>`<button class="opt" data-a="proof" data-id="${id}" aria-pressed="${g.proofs.includes(id)}"><span class="ot"><b>${c.indices[id].n}</b><span>${c.indices[id].t}</span></span></button>`).join('')+`</div>`:`<p class="empty">Il vous faut au moins ${need} pièce${need>1?'s':''} dans le carnet. Continuez l’enquête.</p>`;
  }
  const ready=g.sel&&(need===0||g.proofs.length===need);
  const sn=g.sel&&c.suspects.find(s=>s.id===g.sel).nom;
  if(g.confirm&&ready)h+=`<div class="cta"><p style="margin:0"><b>Accuser ${sn} ?</b> Un mauvais choix compte comme un essai.</p><div class="two"><button class="btn p" data-a="accuse">Confirmer</button><button class="btn g" data-a="cancel">Annuler</button></div></div>`;
  else h+=`<div class="cta"><button class="btn p" data-a="accuse" ${ready?'':'disabled'}>${ready?'Accuser '+sn:'Accuser'}</button></div>`;
  return h;
}
function nav(g){
  const T=[['lieux','Lieux','lieux'],['carnet','Carnet','carnet'],['pers','Personnes','pers'],['accuser','Accuser','acc']];
  return `<nav class="nav" aria-label="Sections du dossier"><div class="navin">${T.map(t=>`<button class="nb" data-a="tab" data-id="${t[0]}" ${g.tab===t[0]?'aria-current="page"':''}>${ico(t[2])}<span>${t[1]}</span>${t[0]==='carnet'&&g.found.length?`<i>${g.found.length}</i>`:''}</button>`).join('')}</div></nav>`;
}
function caseV(){
  const g=S.g,L=LV[g.level];
  const body=g.tab==='lieux'?lieuxTab(g):g.tab==='carnet'?carnetTab(g):g.tab==='pers'?persTab(g):accTab(g);
  return topbar(g)+`<main class="wrap main ${L.cls}">${body}</main>`+nav(g);
}
function baseEndV(){
  const g=S.g,c=g.c,r=S.res,s=c.suspects.find(x=>x.id===c.solution.coupable);
  const idx=CASES.indexOf(c),nx=CASES[idx+1];
  return topbar(null)+`<main class="wrap"><section class="hero"><p class="kick">Dossier ${num(c)} · ${c.titre}</p><h1 class="verdict ${r.win?'win':'lose'}">${r.win?'Affaire classée':'Classée sans suite'}</h1>${r.win?`<p class="stars big-stars" aria-label="${r.stars} étoiles sur 3">${stars(r.stars)}</p>`:'<p class="lead">Le juge d’instruction a refusé vos accusations. Voici ce qui s’était réellement passé.</p>'}</section><section class="brief"><p class="kick">Le coupable</p><h2 class="ct" style="margin-top:6px">${s.nom}</h2><p>${c.solution.expl}</p></section><p class="rule" style="margin-top:14px">Essais ratés : ${g.errs} · Conseils utilisés : ${g.hints} · Pièces trouvées : ${g.found.length} sur ${Object.keys(c.indices).length}</p><div class="cta"><button class="btn p" data-a="replay" data-id="${c.id}">Rejouer ce dossier</button>${nx&&r.win?`<button class="btn g" data-a="open" data-id="${nx.id}">Dossier suivant : ${nx.titre}</button>`:''}<button class="btn g" data-a="home">Tous les dossiers</button></div></main>`;
}
function render(){
  app.innerHTML=S.view==='home'?homeV():S.view==='case'?caseV():endV();
}

/* ---------- Actions ---------- */
function finish(win,st){
 const g=S.g,c=g.c;
 const score=win?Math.max(0,Math.min(3,st)):0;
 S.res={win,stars:score};
 delete S.games[c.id];
 if(win&&(!prog[c.id]||prog[c.id].s<score)){prog[c.id]={s:score};saveProg()}
 S.view='end';
}
function resolve(){
 const g=S.g,c=g.c,L=LV[g.level],sol=c.solution;
 const ok=g.sel===sol.coupable&&g.proofs.length===L.preuves&&g.proofs.every(p=>sol.preuves.includes(p));
 g.players[g.turn].accusations++;
 if(ok){finish(true,Math.max(0,3-g.errs-g.hints));return}
 g.errs++;g.confirm=false;g.proofs=[];
 if(g.errs>=L.essais){finish(false,0);return}
 g.fb='Dossier rejeté : les éléments sont insuffisants. Reprenez l’enquête.';
}
/* Catalogue hebdomadaire : chargement non bloquant et conservation des dossiers d'origine. */
async function loadWeeklyCases(){
  try{
    const response=await fetch('./data/weekly-cases.json',{cache:'no-store'});
    if(!response.ok)throw new Error('Catalogue indisponible');
    const weekly=await response.json();
    if(!Array.isArray(weekly))throw new Error('Format invalide');
    const safe=(v)=>String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const clean=(v)=>Array.isArray(v)?v.map(clean):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,clean(x)])):typeof v==='string'?safe(v):v;
    for(const raw of weekly){
      if(!raw||typeof raw!=='object'||!/^hebdo-\d{4}-\d{2}-\d{2}$/.test(raw.id)||![1,2,3].includes(raw.niv))continue;
      if(CASES.some(c=>c.id===raw.id))continue;
      if(!raw.indices||!Array.isArray(raw.lieux)||!Array.isArray(raw.suspects)||!raw.solution||!Array.isArray(raw.hints))continue;
      CASES.push(clean(raw));
    }
    if(S.view==='home')render();
  }catch(error){console.warn('Enquêtes hebdomadaires non chargées :',error.message)}
}
render();
loadWeeklyCases();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .catch(error => console.warn('Mode hors connexion indisponible :', error));
  });
}
