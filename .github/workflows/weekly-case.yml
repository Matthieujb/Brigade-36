name: Proposition d'enquête hebdomadaire
on:
  schedule:
    - cron: '0 16 * * 5'
    - cron: '0 17 * * 5'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: brigade36-weekly
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer et vérifier une enquête
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: python scripts/weekly_case.py
      - name: Proposer une Pull Request sans publier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/weekly-cases.json; then
            echo "Aucun nouveau dossier : pas de Pull Request."
            exit 0
          fi
          DATE_PARIS="$(TZ=Europe/Paris date +%Y-%m-%d)"
          BRANCH="enquetes/hebdo-${DATE_PARIS}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Une proposition existe déjà pour cette semaine : $BRANCH"
            exit 0
          fi
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly-cases.json
          git commit -m "feat: proposer enquête du ${DATE_PARIS}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "🕵️ Enquête à valider — ${DATE_PARIS}" \
            --body "## Validation humaine obligatoire

          Cette proposition a été générée par IA. Elle **n'est pas publiée** sur le site tant que la Pull Request n'est pas fusionnée dans \`main\`.

          ### Checklist de validation
          - [ ] Le coupable est unique et déterminé dès le départ
          - [ ] Les preuves permettent réellement de le désigner
          - [ ] Les alibis et horaires sont compatibles
          - [ ] Les indices nécessaires sont accessibles dans les lieux
          - [ ] Les interrogatoires ne contredisent pas la solution
          - [ ] La conclusion explique le mobile, le moyen et la chronologie
          - [ ] Le jeu est utilisable sur mobile et ordinateur

          **Pour publier :** examiner \`data/weekly-cases.json\`, puis cliquer sur **Merge pull request**. Pour refuser : fermer la Pull Request sans fusionner."
