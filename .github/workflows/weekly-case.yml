name: Enquête hebdomadaire automatique
on:
  schedule:
    - cron: '0 16 * * 5'
    - cron: '0 17 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brigade36-weekly
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer et contrôler une enquête
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: python scripts/weekly_case.py
      - name: Publier après validation automatique
        shell: bash
        run: |
          set -euo pipefail
          git add data/weekly-cases.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle enquête à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publier enquête hebdomadaire validée"
          git push
