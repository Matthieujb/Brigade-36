<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brigade 36 — Administration</title><style>body{background:#171b22;color:#eee;font:16px system-ui;max-width:900px;margin:auto;padding:20px}h1{color:#e7c34d}button,input,select{font:inherit;padding:12px;margin:5px;max-width:95%}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#252a32;padding:16px}label{display:block}button:disabled{opacity:.5}</style><h1>BRIGADE 36 — Bureau éditorial</h1><p>Préproduction uniquement. Les solutions sont confidentielles.</p><label>Jeton administrateur <input id="token" type="password" autocomplete="off"></label><button id="list">Charger les dossiers</button><label>Difficulté <select id="difficulty"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><button id="generate">Générer un brouillon</button><label>Dossier <select id="cases"></select></label><button id="review">Examiner</button><label><input type="checkbox" id="confirm"> J'ai vérifié la chronologie, les preuves, les alibis et la conclusion.</label><button id="approve">Approuver</button><button id="publish">Publier en préproduction</button><pre id="out" aria-live="polite"></pre><script>
const $=id=>document.getElementById(id),api='https://brigade36-preprod-api.matthieujb1.workers.dev';let reviewed=null,busy=false;
async function call(path,data){const r=await fetch(api+'/admin/'+path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const d=await r.json();if(!r.ok)throw Error(d.erreur||r.status);return d}
async function list(){const d=await call('cases');$('cases').replaceChildren(...d.cases.map(c=>new Option(c.id+' — '+c.difficulty+'★ — '+c.status,c.id)));reviewed=null;$('confirm').checked=false;return d}
function run(fn){return async()=>{if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('out').textContent='Traitement…';try{$('out').textContent=JSON.stringify(await fn(),null,2)}catch(e){$('out').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}}
$('list').onclick=run(list);$('generate').onclick=run(async()=>{const d=await call('generate',{difficulty:Number($('difficulty').value)});await list();return d});$('review').onclick=run(async()=>{reviewed=null;$('confirm').checked=false;const d=await call('review',{id:$('cases').value});reviewed=d.id;return d});$('cases').onchange=()=>{reviewed=null;$('confirm').checked=false;$('out').textContent=''};for(const action of ['approve','publish'])$(action).onclick=run(async()=>{if(reviewed!==$('cases').value||!$('confirm').checked)throw Error('Examinez le dossier et confirmez la validation.');const d=await call(action,{id:reviewed,confirm:true});await list();return d});
</script></html>
